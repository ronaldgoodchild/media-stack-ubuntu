name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n install.sh uninstall.sh update.sh tools/update-stats.sh
      - name: Python syntax
        run: python3 -m py_compile tools/*.py
